# Render Blueprint for VaultFlow Expense Tracker (Full-Stack)
services:
  # 1. Backend REST API Web Service
  - type: web
    name: vaultflow-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard to your Supabase Transaction Pooler URL
      - key: DIRECT_URL
        sync: false # Set in Render Dashboard to your Supabase Direct Connection URL

  # 2. Frontend React Client Static Site
  - type: static
    name: vaultflow-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: vaultflow-api
          property: host
